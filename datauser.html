<!-- ================= MODAL TAMBAH / EDIT USER ================= -->
<div id="userModal" class="modalBox">
<div class="modalContent">

<h3 id="modalTitle" class="mb-3">Tambah User</h3>

<input id="namaForm" placeholder="Nama" class="slot-input">
<select id="genderForm" class="slot-input mt-2">
  <option value="">-- Pilih Jenis Kelamin --</option>
  <option value="Laki-laki">Laki-laki</option>
  <option value="Perempuan">Perempuan</option>
</select>
<input id="emailForm" placeholder="Email" class="slot-input mt-2">

<!-- PASSWORD BARU -->
<input id="passwordForm" type="password" placeholder="Password" class="slot-input">

<input id="nimForm" placeholder="NIM" class="slot-input">
<input id="bbForm" placeholder="Berat Badan (kg)" class="slot-input">
<input id="tbForm" placeholder="Tinggi Badan (cm)" class="slot-input">
<input id="lahirForm" type="date" class="slot-input">
<input id="tujuanForm" placeholder="Tujuan" class="slot-input">

<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>

<script src="firebase.js"></script>
<script src="notifications.js"></script>

<script>

function toggleSidebar(){
sidebar.classList.toggle("show");
overlay.classList.toggle("show");
}

function cekAdmin(){
auth.onAuthStateChanged(u=>{
if(!u) window.location="index.html";
});
}


// 🔥 PENTING UNTUK BAB 4 SKRIPSI (Read Data & Menghitung Usia Otomatis): 
// Bagian ini penting karena menunjukkan bagaimana sistem mengambil data user secara real-time dari Firebase 
// dan melakukan perhitungan usia secara otomatis berdasarkan tanggal lahir.
db.ref("users").on("value", snap=>{

let html="";

if(!snap.exists()){
userTable.innerHTML=`
<tr>
<td colspan="8" style="text-align:center">
Belum ada data user
</td>
</tr>`;
return;
}

snap.forEach(u=>{

let d=u.val();

let usia="-";
if(d.tanggal_lahir){
let t=new Date();
let l=new Date(d.tanggal_lahir);
usia=t.getFullYear()-l.getFullYear();
}

let genderText = "-";
if(d.jk === "L") genderText = "Laki-laki";
else if(d.jk === "P") genderText = "Perempuan";
else if(d.gender) genderText = d.gender;

html+=`
<tr>

<td data-label="Nama">${d.nama||"-"}</td>
<td data-label="Gender">${genderText}</td>
<td data-label="Email">${d.email||"-"}</td>
<td data-label="NIM">${d.nim||"-"}</td>
<td data-label="Berat">${d.bb||"-"}</td>
<td data-label="Tinggi">${d.tb||"-"}</td>
<td data-label="Usia">${usia}</td>
<td data-label="Tujuan">${d.tujuan||"-"}</td>

<td data-label="Aksi">

<button class="btn btn-warning btn-sm mb-1"
onclick="openEdit('${u.key}',${JSON.stringify(d).replace(/"/g,'&quot;')})">
Edit
</button>

<button class="btn btn-danger btn-sm"
onclick="hapus('${u.key}')">
Hapus
</button>

</td>

</tr>`;
});

userTable.innerHTML=html;

});


// 🔥 PENTING UNTUK BAB 4 SKRIPSI (Hapus User via API Backend): 
// Menunjukkan integrasi frontend dengan backend Node.js untuk menghapus user secara permanen
// baik di Firebase Realtime Database maupun Firebase Authentication.
async function hapus(id){
if(confirm("Yakin hapus user ini secara permanen dari Database dan Authentication?")){
  try {
    let res = await fetch("http://localhost:3000/api/users/" + id, { method: "DELETE" });
    let data = await res.json();
    if(!res.ok) throw new Error(data.error);
    alert(data.message);
  } catch(err) {
    alert("Gagal menghapus user: " + err.message + "\nPastikan backend server berjalan (node server.js)");
  }
}
}


let editID=null;


function openAdd(){

editID=null;

modalTitle.innerText="Tambah User";

namaForm.value="";
genderForm.value="";
emailForm.value="";
passwordForm.value="";
nimForm.value="";
bbForm.value="";
tbForm.value="";
lahirForm.value="";
tujuanForm.value="";

userModal.style.display="flex";

}


function openEdit(id,d){

editID=id;

modalTitle.innerText="Edit User";

namaForm.value=d.nama||"";

let genderVal = "";
if(d.jk === "L") genderVal = "Laki-laki";
else if(d.jk === "P") genderVal = "Perempuan";
else if(d.gender) genderVal = d.gender;
genderForm.value=genderVal;

emailForm.value=d.email||"";

passwordForm.value=""; // tidak ubah password

nimForm.value=d.nim||"";
bbForm.value=d.bb||"";
tbForm.value=d.tb||"";
lahirForm.value=d.tanggal_lahir||"";
tujuanForm.value=d.tujuan||"";

userModal.style.display="flex";

}



function closeModal(){
userModal.style.display="none";
}


// 🔥 PENTING UNTUK BAB 4 SKRIPSI (Simpan & Update User via API): 
// Bagian ini penting karena menampilkan logika validasi form dan pengiriman data ke backend (POST) 
// untuk mendaftarkan user baru ke Firebase Auth sekaligus menyimpan biodatanya ke Database.
function saveUser(){

let jkVal = "";
if (genderForm.value === "Laki-laki") jkVal = "L";
else if (genderForm.value === "Perempuan") jkVal = "P";

let data={

nama:namaForm.value,
jk:jkVal,
gender:genderForm.value,
email:emailForm.value,
nim:nimForm.value,
bb:bbForm.value,
tb:tbForm.value,
tanggal_lahir:lahirForm.value,
tujuan:tujuanForm.value

};

let password=passwordForm.value;

if(!data.nama || !data.email){
alert("Nama & Email wajib!");
return;
}


if(editID){

db.ref("users/"+editID).update(data);

}else{

if(!password){
alert("Password wajib diisi!");
return;
}

fetch("http://localhost:3000/api/users", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({...data, password: password})
})
.then(res => res.json().then(d => ({ok: res.ok, body: d})))
.then(res => {
  if(res.ok) {
    alert("Berhasil membuat user!");
  } else {
    alert("Gagal: " + res.body.error);
  }
})
.catch(err => alert("Gagal koneksi ke server: " + err.message + "\nPastikan backend server berjalan (node server.js)"));

}

closeModal();

}


function logout(){
auth.signOut().then(()=>window.location="index.html");
}

</script>

</body>
