<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <!-- WAJIB BIAR RESPONSIVE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Admin</title>

  <link rel="icon" type="image/png" href="images/logo-umj.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body onload="cekAdmin()">

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <h3>Admin Gym</h3>

    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="datauser.html">Users</a>
    <a href="databooking.html">Booking</a>
    <a href="dataabsensi.html">Absensi</a>
    <a href="slotlatihan.html">Slot Latihan</a>
    <a href="#" onclick="logout()">Logout</a>
  </aside>

  <!-- CONTENT -->
  <main class="content">

    <div class="page-container">

      <div class="page-header">
        <div class="left">
          <!-- ✅ FIX HAMBURGER -->
          <button class="menu-btn d-md-none" onclick="toggleSidebar()">
            <span></span>
            <span></span>
            <span></span>
          </button>

          <h2>Dashboard</h2>
        </div>
      </div>

      <!-- CARD -->
      <div class="row g-3">

        <div class="col-12 col-md-4">
          <div class="card text-white bg-primary shadow dashboard-card">
            <div class="card-body text-center">
              <h4 id="userCount">0</h4>
              <p>Users</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="card text-white bg-success shadow dashboard-card">
            <div class="card-body text-center">
              <h4 id="bookingCount">0</h4>
              <p>Booking</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="card text-white bg-warning shadow dashboard-card">
            <div class="card-body text-center">
              <h4 id="absenCount">0</h4>
              <p>Absensi</p>
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>

</div>

<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script src="notifications.js"></script>

<script>
function cekAdmin(){
  auth.onAuthStateChanged(u=>{
    if(!u) window.location="index.html";
  });
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("show");
  document.getElementById("overlay").classList.toggle("show");

  // ✅ TAMBAHAN ANIMASI
  document.querySelector(".menu-btn").classList.toggle("active");
}

function logout(){
  auth.signOut().then(()=> window.location="index.html");
}

db.ref("users").on("value", s=>{
  userCount.innerText = s.numChildren();
});

db.ref("bookings").on("value", s=>{
  bookingCount.innerText = s.numChildren();
});

db.ref("absensi").on("value", s=>{
  absenCount.innerText = s.numChildren();
});
</script>

</body>
</html>
